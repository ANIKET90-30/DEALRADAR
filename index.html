<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DealRadar</title><style>
:root{--bg:#f5f6fa;--card:#fff;--tx:#161824;--mut:#6b7090;--bd:#e3e5ef;--ac:#6c5ce7;--gr:#12a150;--rd:#e5484d;--am:#f59e0b}
@media(prefers-color-scheme:dark){:root{--bg:#0e1019;--card:#171a28;--tx:#eceefa;--mut:#8f94b5;--bd:#262a40;--ac:#8b7cff;--gr:#34d27b;--rd:#ff6b70;--am:#fbbf24;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,sans-serif}
.w{max-width:1100px;margin:0 auto;padding:16px}header{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:14px}
h1{font-size:22px;margin:0}h1 span{color:var(--ac)}.s{color:var(--mut);font-size:12px}
button,input,select{font:inherit;color:var(--tx)}.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}.stt{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}.stt b{display:block;font-size:19px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.stt small{color:var(--mut)}
.tabs,.chips,.bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tab,.chip{border:1px solid var(--bd);background:var(--card);border-radius:18px;padding:5px 13px;cursor:pointer}.on{background:var(--ac);color:#fff;border-color:var(--ac)}.chip.on{background:none;color:var(--ac);font-weight:600}
.bar input,.bar select{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px}.bar input{flex:1;min-width:160px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}h2{font-size:16px;margin:16px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}.card.hot{border-color:var(--gr)}.card img{width:100%;height:110px;object-fit:cover;background:var(--bd)}.cb{padding:11px;display:flex;flex-direction:column;gap:6px}
.top{display:flex;justify-content:space-between;gap:6px}.nm{font-weight:700}.tag{font-size:12px;color:var(--mut)}.pr{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.pr b{font-size:22px}.old{color:var(--mut);text-decoration:line-through;font-size:13px}
.off{background:var(--gr);color:#fff;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:700}.low{background:var(--am);color:#1a1200;border-radius:6px;padding:1px 6px;font-size:11px;font-weight:700}
.sl{font-size:12px;color:var(--mut);display:grid;grid-template-columns:1fr auto;gap:1px 8px}.sl .b{color:var(--gr);font-weight:700}
.ic{background:none;border:0;cursor:pointer;font-size:18px;padding:2px 4px;color:var(--mut)}.ic.on{color:var(--rd)}svg{width:100%;height:30px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px;flex-wrap:wrap}.row .g{flex:1;min-width:140px}.row input{width:80px;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:5px}
.hit{color:var(--gr);font-weight:700}.toast{background:var(--gr);color:#fff;border-radius:10px;padding:10px 14px;margin-bottom:10px;font-weight:600}.empty{color:var(--mut);text-align:center;padding:30px}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:10px;background:var(--card)}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--bd)}th:first-child,td.gn{text-align:left;position:sticky;left:0;background:var(--card)}.bst{background:rgba(18,161,80,.16);color:var(--gr);font-weight:700}.na{color:var(--mut)}

/* ===== Cinematic theme ===== */
:root{--bg:#07080d;--card:rgba(20,22,32,.72);--tx:#f1ece2;--mut:#9a968a;--bd:rgba(255,215,150,.14);--ac:#e8b04a;--gr:#3ddc97;--rd:#ff5d6c;--am:#ffcf5c;color-scheme:dark}
body{background:radial-gradient(1200px 600px at 50% -10%,rgba(232,176,74,.18),transparent 60%),radial-gradient(900px 500px at 100% 100%,rgba(0,160,180,.15),transparent 60%),radial-gradient(700px 400px at 0% 60%,rgba(120,40,60,.12),transparent 60%),#07080d;background-attachment:fixed;font-family:"Segoe UI",Inter,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.7))}
body::after{content:"";position:fixed;inset:-50%;pointer-events:none;z-index:0;opacity:.08;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");animation:grain .8s steps(4) infinite}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-1%)}100%{transform:translate(0,0)}}
@media(prefers-reduced-motion:reduce){body::after{animation:none}.card{transition:none}}
.w{position:relative;z-index:1}
header{border-bottom:1px solid var(--bd);padding-bottom:14px;margin-bottom:18px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:28px;font-weight:400;letter-spacing:.2em;text-transform:uppercase}h1 span{color:var(--ac);font-weight:700;text-shadow:0 0 22px rgba(232,176,74,.55)}
h2{font-family:Georgia,"Times New Roman",serif;font-size:14px;font-weight:400;letter-spacing:.16em;text-transform:uppercase;color:var(--ac)}
.stt,.row,.tw,.bar input,.bar select,.tab,.chip{backdrop-filter:blur(8px)}
.stt b{font-family:Georgia,serif;font-weight:400}
.card{backdrop-filter:blur(8px);transition:transform .25s,box-shadow .25s,border-color .25s}
.card:hover{transform:translateY(-4px);border-color:rgba(232,176,74,.55);box-shadow:0 14px 40px rgba(0,0,0,.6),0 0 28px rgba(232,176,74,.12)}
.card.hot{border-color:rgba(61,220,151,.5);box-shadow:0 0 24px rgba(61,220,151,.1)}
.card img{height:130px;-webkit-mask-image:linear-gradient(#000 50%,transparent);mask-image:linear-gradient(#000 50%,transparent)}
.cb{margin-top:-26px;position:relative}
.btn{background:linear-gradient(135deg,#f3c46a,#c98a1e);color:#1a1200;box-shadow:0 0 18px rgba(232,176,74,.3)}
.btn.g{background:var(--card);color:var(--tx);box-shadow:none}
.tab.on{background:linear-gradient(135deg,#f3c46a,#c98a1e);color:#1a1200;border-color:transparent;font-weight:600}
.chip.on{background:rgba(232,176,74,.1);color:var(--ac);border-color:var(--ac)}
.off{color:#04140c}.row input{background:#0b0c12}
th:first-child,td.gn{background:#12141d}th{color:var(--ac);font-weight:600;letter-spacing:.04em}
.bst{background:rgba(61,220,151,.14)}
</style></head><body><div class="w">
<header><div><h1>Deal<span>Radar</span></h1><div class="s" id="last"></div></div><button class="btn" id="sc">⟳ Scrape now</button></header>
<div id="toasts"></div><div class="st" id="stats"></div><div class="tabs" id="tabs"></div><div id="view"></div></div>
<script>
let D=[],S={tab:"deals",q:"",cat:"All",sort:"disc"};const $=i=>document.getElementById(i);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const usd=n=>"$"+n.toFixed(2),inr=n=>"₹"+Math.round(n).toLocaleString("en-IN");
const post=(u,b)=>fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})});
async function load(){D=await (await fetch("/api/deals")).json();render()}
async function status(){const s=await (await fetch("/api/status")).json();
 $("last").textContent=s.running?"Scraping live prices…":s.last?"Last scrape: "+new Date(s.last*1000).toLocaleString():"First scrape running, check back in ~2 min";
 if(s.error)$("last").textContent+=" · error: "+s.error;return s}
function spark(h){if(h.length<2)return"";const mn=Math.min(...h),mx=Math.max(...h),r=mx-mn||1;
 return `<svg viewBox="0 0 200 30" preserveAspectRatio="none"><polyline fill="none" stroke="var(--ac)" stroke-width="2" points="${h.map((v,i)=>(i/(h.length-1)*200).toFixed(1)+","+(27-(v-mn)/r*24).toFixed(1)).join(" ")}"/></svg>`}
function cmp(l){const cnt={};D.forEach(g=>g.stores.forEach(s=>cnt[s.name]=(cnt[s.name]||0)+1));
 const cols=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]),m=l.slice(0,150);
 return `<div class="s" style="margin-bottom:6px">Green = cheapest store for that game · ${cols.length} stores · ${m.length} of ${l.length} games · scroll sideways →</div><div class="tw"><table><thead><tr><th>Game</th>${cols.map(c=>`<th>${esc(c)}</th>`).join("")}<th>Spread</th></tr></thead><tbody>${m.map(g=>{const p={};g.stores.forEach(s=>p[s.name]=s);const hi=Math.max(...g.stores.map(s=>s.sale));
 return `<tr><td class="gn">${esc(g.title)}${g.low_ever?`<div class="tag">All-time low ${usd(g.low_ever)}</div>`:""}</td>${cols.map(c=>{const s=p[c];return s?`<td class="${s.sale==g.best?"bst":""}">${usd(s.sale)}${s.normal>s.sale?`<div class="tag">-${Math.round((1-s.sale/s.normal)*100)}%</div>`:""}</td>`:`<td class="na">–</td>`}).join("")}<td>${hi>g.best?usd(hi-g.best):"–"}</td></tr>`}).join("")}</tbody></table></div>`}
function card(g){return `<div class="card ${g.discount>=70?"hot":""}"><img loading="lazy" src="${esc(g.thumb)}" alt=""><div class="cb"><div class="top"><div><div class="nm">${esc(g.title)}</div><div class="tag">${esc(g.genres.slice(0,2).join(" · "))}${g.meta?" · MC "+g.meta:""}</div></div><div><button class="ic ${g.wish?"on":""}" data-w="${g.id}">${g.wish?"♥":"♡"}</button><button class="ic" data-a="${g.id}">${g.alert!=null?"🔔":"🔕"}</button></div></div>
<div class="pr"><b>${usd(g.best)}</b>${g.discount>0?`<span class="old">${usd(g.normal)}</span><span class="off">-${g.discount}%</span>`:""}${g.lowest?'<span class="low">ALL-TIME LOW</span>':""}</div>
${g.low_ever&&!g.lowest?`<div class="tag">All-time low: ${usd(g.low_ever)}</div>`:""}${g.inr?`<div class="tag">Steam India: ${inr(g.inr[0])}${g.inr[1]>g.inr[0]?` <s>${inr(g.inr[1])}</s>`:""}</div>`:""}${spark(g.hist)}
<div class="sl">${g.stores.slice(0,5).map((s,i)=>`<span class="${i?"":"b"}">${esc(s.name)}</span><span class="${i?"":"b"}">${usd(s.sale)}</span>`).join("")}${g.stores.length>5?`<span>+${g.stores.length-5} more stores</span><span>see Compare</span>`:""}</div></div></div>`}
function render(){const tr=D.filter(g=>g.triggered);$("toasts").innerHTML=tr.map(g=>`<div class="toast">🔔 ${esc(g.title)} hit your target: ${usd(g.best)} (target ${usd(g.alert)})</div>`).join("");
 const top=[...D].sort((a,b)=>b.discount-a.discount)[0],avg=D.length?Math.round(D.reduce((s,g)=>s+g.discount,0)/D.length):0,na=D.filter(g=>g.alert!=null).length;
 $("stats").innerHTML=`<div class="stt"><b>${D.length}</b><small>Games tracked</small></div><div class="stt"><b>${avg}%</b><small>Avg. discount</small></div><div class="stt"><b>${top?esc(top.title):"–"}</b><small>Best deal${top?" · -"+top.discount+"%":""}</small></div><div class="stt"><b>${tr.length}/${na}</b><small>Alerts triggered</small></div>`;
 const nw=D.filter(g=>g.wish).length;$("tabs").innerHTML=[["deals","Deals"],["cmp","Compare"],["wish","Wishlist ("+nw+")"],["alerts","Alerts ("+na+")"]].map(t=>`<button class="tab ${S.tab==t[0]?"on":""}" data-t="${t[0]}">${t[1]}</button>`).join("");
 let h="";if(S.tab=="deals"||S.tab=="cmp"){const cats=["All",...new Set(D.flatMap(g=>g.genres))].sort((a,b)=>a=="All"?-1:b=="All"?1:a.localeCompare(b));
  const f={disc:(a,b)=>b.discount-a.discount,low:(a,b)=>a.best-b.best,high:(a,b)=>b.best-a.best,name:(a,b)=>a.title.localeCompare(b.title)}[S.sort];
  const l=D.filter(g=>g.title.toLowerCase().includes(S.q.toLowerCase())&&(S.cat=="All"||g.genres.includes(S.cat))).sort(f);
  if(S.tab=="deals"&&!S.q&&S.cat=="All"&&D.length)h+=`<h2>🔥 Best deals right now</h2><div class="grid">${[...D].sort((a,b)=>b.discount-a.discount).slice(0,4).map(card).join("")}</div><h2>All games</h2>`;
  h+=`<div class="bar"><input id="q" placeholder="Search games…" value="${esc(S.q)}"><select id="so"><option value="disc">Biggest discount</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option><option value="name">Name A–Z</option></select></div><div class="chips">${cats.map(c=>`<span class="chip ${S.cat==c?"on":""}" data-c="${esc(c)}">${esc(c)}</span>`).join("")}</div>`;
  h+=S.tab=="cmp"&&l.length?cmp(l):l.length?`<div class="grid">${l.map(card).join("")}</div>`:`<div class="empty">${D.length?"No games match.":"No prices yet. The first scrape is running, refresh in a minute or two."}</div>`}
 else if(S.tab=="wish"){const l=D.filter(g=>g.wish);h=l.length?`<div class="grid">${l.map(card).join("")}</div>`:`<div class="empty">Wishlist empty. Tap ♡ on a game.</div>`}
 else{const l=D.filter(g=>g.alert!=null);h=l.length?l.map(g=>`<div class="row"><div class="g"><b>${esc(g.title)}</b><div class="tag">Now ${usd(g.best)} at ${esc(g.stores[0].name)}</div></div><label>Alert at ≤ $<input type="number" min="0" step="0.5" value="${g.alert}" data-e="${g.id}"></label><span class="${g.triggered?"hit":"tag"}">${g.triggered?"✔ Target hit!":"Watching"}</span><button class="btn g" data-a="${g.id}">Remove</button></div>`).join(""):`<div class="empty">No alerts. Tap 🔕 on a game.</div>`}
 $("view").innerHTML=h;const q=$("q");if(q){q.oninput=e=>{S.q=e.target.value;const p=e.target.selectionStart;render();const n=$("q");n.focus();n.setSelectionRange(p,p)};$("so").value=S.sort;$("so").onchange=e=>{S.sort=e.target.value;render()}}}
document.addEventListener("click",async e=>{const t=e.target.closest("[data-t],[data-c],[data-w],[data-a]");if(!t)return;
 if(t.dataset.t)S.tab=t.dataset.t;else if(t.dataset.c)S.cat=t.dataset.c;
 else if(t.dataset.w){const g=D.find(x=>x.id==t.dataset.w);await post("/api/wish",{id:g.id,on:!g.wish});await load();return}
 else if(t.dataset.a){const g=D.find(x=>x.id==t.dataset.a);await post("/api/alert",{id:g.id,target:g.alert!=null?null:+(g.best*.85).toFixed(2)});await load();return}
 render()});
document.addEventListener("change",async e=>{if(e.target.dataset.e){await post("/api/alert",{id:e.target.dataset.e,target:+e.target.value||0});load()}});
$("sc").onclick=async()=>{await post("/api/scrape");$("last").textContent="Scraping live prices…"};
let was=false;async function tick(){const s=await status();if(was&&!s.running)load();was=s.running}
load();status();setInterval(tick,4000);
</script></body></html>
